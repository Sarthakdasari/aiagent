<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Signal Room</title>
  <style>
    :root{--ink:#0a1020;--panel:#111b31;--panel2:#16233e;--amber:#f7b955;--cyan:#65e6df;--muted:#8ea7c7;--paper:#f5f7fb;--error:#e66b6b;--line:rgba(142,167,199,.2);--shadow:0 18px 60px rgba(0,0,0,.24)}
    *{box-sizing:border-box} body{margin:0;background:var(--ink);color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.26;background-image:linear-gradient(rgba(101,230,223,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(101,230,223,.07) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 82%)}
    .shell{max-width:1400px;margin:auto;padding:30px 34px 54px;position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.mark{width:38px;height:38px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 24px rgba(101,230,223,.18)}.mark:before,.mark:after{content:"";position:absolute;background:var(--cyan)}.mark:before{width:1px;height:46px}.mark:after{height:1px;width:46px}.mark span{width:7px;height:7px;border-radius:50%;background:var(--amber);z-index:1}.eyebrow{text-transform:uppercase;color:var(--cyan);font-size:10px;font-weight:700;letter-spacing:.2em}.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,3vw,38px);line-height:1;margin:5px 0 0;font-weight:400;letter-spacing:-.03em}.top-actions{display:flex;gap:18px;align-items:center}.runtime{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}button{font:inherit;cursor:pointer}.reset{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-size:12px}.reset:hover,.reset:focus-visible{border-color:var(--cyan);color:var(--paper);outline:none}
    .layout{display:grid;grid-template-columns:minmax(320px,.84fr) minmax(480px,1.3fr);gap:24px;align-items:start}.column-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:700}.counter{color:var(--cyan);font-variant-numeric:tabular-nums}.card{background:linear-gradient(145deg,rgba(22,35,62,.95),rgba(17,27,49,.92));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.conversation{min-height:690px;padding:20px;display:flex;flex-direction:column}.chat{display:flex;flex-direction:column;gap:16px;flex:1;overflow:auto;padding:4px 2px 22px}.message{max-width:88%;padding:14px 15px;border-radius:14px;font-size:14px;line-height:1.55}.message.agent{border:1px solid var(--line);background:rgba(10,16,32,.44);color:#d6e0ed;border-top-left-radius:4px}.message.user{align-self:flex-end;background:var(--amber);color:#24190a;border-bottom-right-radius:4px}.message small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}.message.user small{color:#6e4b17}.empty-note{color:var(--muted);font-family:Georgia,serif;font-size:20px;line-height:1.35;margin:auto 20px;text-align:center}.composer{border-top:1px solid var(--line);padding-top:17px}.prompt{width:100%;min-height:88px;resize:vertical;background:#0b1428;color:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14px;line-height:1.5}.prompt:focus{outline:2px solid var(--cyan);outline-offset:2px;border-color:transparent}.composer-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:11px}.examples{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid rgba(101,230,223,.35);background:rgba(101,230,223,.06);color:var(--cyan);border-radius:99px;padding:7px 10px;font-size:11px}.chip:hover,.chip:focus-visible{background:rgba(101,230,223,.14);outline:none}.send{border:0;background:var(--cyan);color:#081520;border-radius:10px;padding:11px 16px;font-weight:800;font-size:12px;white-space:nowrap}.send:hover,.send:focus-visible{background:#9af0eb;outline:2px solid var(--cyan);outline-offset:3px}.send:disabled{opacity:.5;cursor:wait}
    .trace-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.trace-title{font-family:Georgia,serif;font-size:22px;font-weight:400}.live{display:flex;align-items:center;gap:7px;color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.13em}.live i{display:block;width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}.trace-shell{padding:20px 22px 24px;position:relative;overflow:hidden}.trace-shell:after{content:"";position:absolute;right:-120px;top:-120px;width:300px;height:300px;border:1px solid rgba(101,230,223,.08);border-radius:50%;box-shadow:0 0 0 30px rgba(101,230,223,.02),0 0 0 70px rgba(101,230,223,.02);pointer-events:none}.goal{border:1px solid rgba(247,185,85,.35);background:rgba(247,185,85,.07);border-radius:12px;padding:14px 16px;margin-bottom:22px}.goal-kicker{color:var(--amber);font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:800}.goal-text{margin-top:7px;font-size:15px;line-height:1.4;color:#ffedd0}.timeline{position:relative;padding-left:43px}.timeline:before{content:"";position:absolute;left:14px;top:4px;bottom:8px;width:1px;background:linear-gradient(var(--cyan),rgba(142,167,199,.18) 75%,transparent)}.step{position:relative;margin-bottom:13px;opacity:.48;transition:opacity .35s,transform .35s}.step:before{content:"";position:absolute;left:-35px;top:17px;width:13px;height:13px;border:2px solid #47617f;border-radius:50%;background:var(--panel);z-index:1;transition:.35s}.step.active,.step.done{opacity:1}.step.active{transform:translateX(3px)}.step.active:before{border-color:var(--amber);background:var(--amber);box-shadow:0 0 0 5px rgba(247,185,85,.12),0 0 18px rgba(247,185,85,.5)}.step.done:before{border-color:var(--cyan);background:var(--cyan);box-shadow:0 0 12px rgba(101,230,223,.35)}.step-card{background:rgba(10,16,32,.4);border:1px solid var(--line);border-radius:13px;padding:14px 15px}.step.active .step-card{border-color:rgba(247,185,85,.42);background:linear-gradient(120deg,rgba(247,185,85,.08),rgba(10,16,32,.28))}.step-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.step-name{font-weight:750;font-size:13px}.step-num{color:var(--muted);font-size:10px;letter-spacing:.1em}.step-copy{color:#aebed3;font-size:12px;line-height:1.5;margin:8px 0 0}.status{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px}.status.done{color:var(--cyan);border-color:rgba(101,230,223,.32)}.status.waiting{color:var(--amber);border-color:rgba(247,185,85,.34)}.status.error{color:var(--error);border-color:rgba(230,107,107,.34)}.tool-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tool{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--cyan);background:rgba(101,230,223,.08);border:1px solid rgba(101,230,223,.22);padding:5px 8px;border-radius:6px;font-size:10px}.result{margin-top:10px;padding:9px 10px;border-left:2px solid var(--cyan);background:rgba(101,230,223,.05);color:#d2e9e7;font-size:11px;line-height:1.45}.approval{margin-top:10px;padding:10px 11px;background:rgba(247,185,85,.08);border:1px dashed rgba(247,185,85,.5);color:#ffdda1;font-size:11px;border-radius:8px}.final{margin:18px 0 0 43px;border:1px solid rgba(101,230,223,.35);background:linear-gradient(125deg,rgba(101,230,223,.1),rgba(10,16,32,.2));border-radius:13px;padding:15px}.final strong{color:var(--cyan);font-size:13px}.final p{color:#cbd8e6;font-size:12px;line-height:1.5;margin:7px 0 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:900px){.shell{padding:22px 16px 36px}.topbar{align-items:flex-start}.top-actions{flex-direction:column;align-items:flex-end;gap:9px}.layout{grid-template-columns:1fr}.conversation{min-height:560px}.trace-shell{min-height:500px}}
    @media(max-width:520px){.topbar{display:grid;grid-template-columns:1fr;gap:18px;padding-bottom:18px}.brand{align-items:flex-start}.top-actions{width:100%;display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:10px}.runtime{font-size:10px}.reset{padding:8px 11px}.title{font-size:27px;line-height:1.08}.conversation{padding:15px}.trace-shell{padding:16px}.composer-row{align-items:flex-end;flex-direction:column}.send{width:100%}.message{max-width:94%}.timeline{padding-left:33px}.timeline:before{left:10px}.step:before{left:-28px}.final{margin-left:33px}.review-actions button,.error-actions button{flex:1}}
    .step.error:before{border-color:var(--error);background:var(--error);box-shadow:0 0 0 5px rgba(230,107,107,.12)}.step.error .step-card{border-color:rgba(230,107,107,.5);background:linear-gradient(120deg,rgba(230,107,107,.08),rgba(10,16,32,.28))}.review{margin-top:10px;padding:11px;background:rgba(247,185,85,.06);border:1px solid rgba(247,185,85,.3);border-radius:9px}.review-label{color:var(--amber);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.draft{color:#f5e6ca;font-size:11px;line-height:1.45;margin:7px 0 10px}.review-actions,.error-actions{display:flex;gap:7px;flex-wrap:wrap}.review-actions button,.error-actions button{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:11px;background:transparent;color:var(--paper)}.review-actions .approve,.error-actions .retry{background:var(--cyan);color:#081520;border-color:var(--cyan);font-weight:800}.review-actions .reject,.error-actions .replan{color:var(--amber);border-color:rgba(247,185,85,.45)}.review-actions button:focus-visible,.error-actions button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.error-box{margin-top:10px;padding:11px;background:rgba(230,107,107,.08);border:1px solid rgba(230,107,107,.4);border-radius:9px;color:#ffd4d4;font-size:11px;line-height:1.45}.review-actions button:disabled,.error-actions button:disabled{opacity:.55;cursor:default}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="mark" aria-hidden="true"><span></span></div><div><div class="eyebrow">Teaching instrument / 01</div><h1 class="title">Agent Signal Room</h1></div></div>
      <div class="top-actions"><div class="runtime"><span class="dot"></span><span id="runtimeText">local runtime ready</span></div><button class="reset" id="resetBtn">↺ Reset room</button></div>
    </header>
    <div class="layout">
      <section aria-labelledby="conversationLabel"><div class="column-label"><span id="conversationLabel">Conversation</span><span class="counter" id="messageCount">00 messages</span></div><div class="card conversation"><div class="chat" id="chat"><p class="empty-note">Give the agent a mission.<br><span style="color:var(--cyan)">Watch it think in signals.</span></p></div><div class="composer"><label class="sr-only" for="prompt">Your request</label><textarea class="prompt" id="prompt" placeholder="Ask the agent to research, check, or prepare something…"></textarea><div class="composer-row"><div class="examples"><button class="chip" data-prompt="What is the weather in Mumbai today, and email me a short packing note?">weather + email</button><button class="chip" data-prompt="Research Wikipedia's page on black holes and email me three key points.">Wikipedia + email</button></div><button class="send" id="sendBtn">Launch mission ↗</button></div></div></div></section>
      <section aria-labelledby="traceLabel"><div class="trace-head"><div class="column-label" style="margin:0"><span id="traceLabel">Mission trace</span></div><div class="live"><i></i><span id="liveText">standing by</span></div></div><div class="card trace-shell"><div class="goal"><div class="goal-kicker">Current objective</div><div class="goal-text" id="goalText">No request received yet. The room is listening.</div></div><div class="timeline" id="timeline"></div><div class="final" id="final" hidden><strong>Signal resolved · answer delivered</strong><p id="finalText"></p></div></div></section>
    </div>
  </main>
  <script>
    const $ = s => document.querySelector(s);
    const chat = $('#chat'), timeline = $('#timeline'), promptBox = $('#prompt'), sendBtn = $('#sendBtn');
    const stages = [
      {name:'Request received', copy:'The agent turns your natural-language request into a clear objective.', tool:'intake.parse', result:'Intent identified and context window opened.'},
      {name:'Plan assembled', copy:'A short sequence is drafted before any tool is called.', tool:'planner.route', result:'1 · gather information  →  2 · prepare email  →  3 · ask for approval'},
      {name:'Tools selected', copy:'The agent chooses only the capabilities needed for this mission.', tool:'weather.lookup', second:'wikipedia.search', result:'Read-only research tools selected. Email action is gated.'},
      {name:'Results returned', copy:'Tool output comes back into the agent loop as new context.', tool:'tool.result', result:'Mumbai · 29°C · partly cloudy · 62% humidity. Source: weather.lookup · 10:42 local', error:true},
      {name:'Next step started', copy:'The agent uses the result to prepare the next safe action.', tool:'email.draft', result:'Draft uses the weather evidence: “Pack light layers and an umbrella for Mumbai.”', approval:true},
      {name:'Final answer', copy:'The agent summarizes what happened and hands control back to you.', tool:'response.compose', result:'Mission complete.'}
    ];
    let runToken = 0;
    function buildStages(prompt){
      const wiki=/wikipedia|research|black hole|source/i.test(prompt);
      const evidence=wiki?'Wikipedia research excerpt: black holes are regions of spacetime where gravity prevents light from escaping. Source: wikipedia.search.':'Mumbai weather: 29 C, partly cloudy, 62% humidity. Source: weather.lookup, 10:42 local.';
      const draft=wiki?'Draft uses the research evidence: black holes have an event horizon and can grow through accretion.':'Draft uses the weather evidence: pack light layers and an umbrella for Mumbai.';
      return {wiki,evidence,draft,tools:wiki?['wikipedia.search','wikipedia.page']:['weather.lookup','weather.forecast'],errorMessage:wiki?'wikipedia.search timed out. The planner paused safely instead of inventing a source excerpt.':'weather.lookup timed out. The planner paused safely instead of inventing a weather result.',retryResult:wiki?evidence+' Retry succeeded.':evidence+' Retry succeeded.'};
    }
    function addMessage(text, who){ const el=document.createElement('div'); el.className='message '+who; el.innerHTML='<small>'+(who==='user'?'you':'signal room')+'</small>'+escapeHtml(text); chat.appendChild(el); chat.scrollTop=chat.scrollHeight; $('#messageCount').textContent=String(chat.querySelectorAll('.message').length).padStart(2,'0')+' messages'; }
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function card(stage, i){ const el=document.createElement('article'); el.className='step'; el.innerHTML=`<div class="step-card"><div class="step-top"><span class="step-name">${stage.name}</span><span class="step-num">0${i+1} / 06 <b class="status">queued</b></span></div><p class="step-copy">${stage.copy}</p><div class="tool-row"><span class="tool">${stage.tool}</span>${stage.second?`<span class="tool">${stage.second}</span>`:''}</div><div class="result" hidden>${stage.result}</div>${stage.error?'<div class="error-box" hidden>⚠ weather.lookup timed out. The planner paused safely instead of inventing a result.<div class="error-actions"><button class="retry" type="button">Retry tool</button><button class="replan" type="button">Replan with cached context</button></div></div>':''}${stage.approval?'<div class="approval" hidden>⚠ approval required · the agent will wait here before sending</div><div class="review" hidden><div class="review-label">Human review · outbound email</div><div class="draft">To: you · Subject: Mumbai packing note<br>“Pack light layers and an umbrella for Mumbai.”</div><div class="review-actions"><button class="approve" type="button">Approve & continue</button><button class="reject" type="button">Reject & stop email</button></div></div>':''}</div>`; timeline.appendChild(el); return el; }
    function setStatus(el, text, kind){ const s=el.querySelector('.status'); s.textContent=text; s.className='status '+(kind||''); }
    function wait(ms){return new Promise(r=>setTimeout(r,ms));}
    async function launch(){ const prompt=promptBox.value.trim(); if(!prompt||sendBtn.disabled)return; const token=++runToken; const mission=buildStages(prompt); const injectError=/\b(error|fail|timeout|simulate)\b/i.test(prompt); $('.empty-note')?.remove(); addMessage(prompt,'user'); promptBox.value=''; sendBtn.disabled=true; $('#liveText').textContent='tracing live'; $('#goalText').textContent=prompt; timeline.innerHTML=''; $('#final').hidden=true; const els=stages.map(card); els.forEach((el,index)=>{el.querySelectorAll('.tool').forEach((tool,n)=>{tool.textContent=mission.tools[n]||mission.tools[0]});if(index===3){el.querySelector('.result').textContent=mission.evidence;el.querySelector('.error-box').childNodes[0].textContent=mission.errorMessage}else if(index===4){el.querySelector('.result').textContent=mission.draft;el.querySelector('.draft').textContent=mission.draft}}); els[0].querySelector('.tool').textContent='intake.parse'; els[1].querySelector('.tool').textContent='planner.route'; els[4].querySelector('.tool').textContent='email.draft'; els[5].querySelector('.tool').textContent='response.compose'; let answer=''; let approval='approved';
      for(let i=0;i<els.length;i++){ if(token!==runToken)return; const el=els[i]; el.classList.add('active'); setStatus(el,'working','waiting'); await wait(i===0?480:620);
        if(i===3 && injectError){ el.classList.remove('active'); el.classList.add('error'); el.querySelector('.result').hidden=false; el.querySelector('.error-box').hidden=false; setStatus(el,'tool error','error'); $('#liveText').textContent='replan required'; const choice=await new Promise(resolve=>{el.querySelector('.retry').addEventListener('click',()=>resolve('retry'),{once:true});el.querySelector('.replan').addEventListener('click',()=>resolve('replan'),{once:true})}); $('#liveText').textContent='replanning'; if(choice==='retry'){el.classList.remove('error');el.classList.add('active');setStatus(el,'retrying','waiting');await wait(700);el.querySelector('.error-box').hidden=true;el.querySelector('.result').textContent=mission.retryResult;setStatus(el,'complete','done');}else{el.classList.remove('error');el.classList.add('done');el.querySelector('.error-box').textContent='Replanned safely: using a cached classroom result so the request can continue.';el.querySelector('.error-box').hidden=false;setStatus(el,'replanned','done');} $('#liveText').textContent='tracing live'; continue; }
        el.querySelector('.result').hidden=false; if(el.querySelector('.approval')){el.querySelector('.approval').hidden=false;el.querySelector('.review').hidden=false;setStatus(el,'approval required','waiting');el.classList.remove('active');const choice=await new Promise(resolve=>{el.querySelector('.approve').addEventListener('click',()=>resolve('approved'),{once:true});el.querySelector('.reject').addEventListener('click',()=>resolve('rejected'),{once:true})}); approval=choice;el.querySelector('.review').innerHTML=choice==='approved'?'<div class="review-label">Approved · outbound email released</div><div class="draft">The agent may now continue to the final response.</div>':'<div class="review-label">Rejected · outbound email canceled</div><div class="draft">No message was sent. The agent will report the safe outcome.</div>';setStatus(el,choice==='approved'?'approved':'rejected',choice==='approved'?'done':'error');el.classList.add(choice==='approved'?'done':'error');if(choice==='rejected')el.querySelector('.step-copy').textContent='You stopped the external action. The trace preserves the decision for learning.';}else{setStatus(el,'complete','done');el.classList.remove('active');el.classList.add('done');} }
      try{const res=await fetch('/api/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})}); if(!res.ok)throw new Error('API '+res.status); const data=await res.json(); answer=data.answer||'Mission complete.'; $('#runtimeText').textContent=data.source==='gemini'?'Gemini connected · cloud':'Gemini unavailable';}catch(e){answer='The Gemini planning service was unavailable; no model response was generated.';$('#runtimeText').textContent='Gemini unavailable'; const last=els[els.length-1];last.classList.add('error');setStatus(last,'blocked','error');last.querySelector('.step-copy').textContent='The response service failed; no fallback response was generated.';}
      answer=answer.replace(/ready for your approval/gi,'approval was recorded for this mission'); if(approval==='rejected')answer='No email was sent because you rejected the draft. The '+(mission.wiki?'research result':'weather result')+' remains available for your next decision.'; $('#finalText').textContent=answer; $('#final').hidden=false; addMessage(answer,'agent'); $('#liveText').textContent=approval==='rejected'?'safe stop · mission complete':'mission complete'; sendBtn.disabled=false;
    }
    function reset(){runToken++;chat.innerHTML='<p class="empty-note">Give the agent a mission.<br><span style="color:var(--cyan)">Watch it think in signals.</span></p>';timeline.innerHTML='';$('#final').hidden=true;$('#goalText').textContent='No request received yet. The room is listening.';$('#liveText').textContent='standing by';$('#runtimeText').textContent='Gemini runtime checking';$('#messageCount').textContent='00 messages';sendBtn.disabled=false;promptBox.focus()}
    // Legacy demo handlers are intentionally not wired. The dynamic controller below owns the room.
  </script>
  <script>
    (() => {
      let activeMission = null;
      const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const statusClass = status => status === 'error' || status === 'rejected' ? 'error' : status === 'approval_required' || status === 'pending' ? 'waiting' : 'done';
      const statusLabel = status => ({approval_required:'approval required',pending:'pending',done:'complete',rejected:'rejected',error:'error'}[status] || status);
      function addLiveMessage(text, who){ const el=document.createElement('div'); el.className='message '+who; el.innerHTML='<small>'+(who==='user'?'you':'signal room')+'</small>'+safe(text); $('#chat').appendChild(el); $('#chat').scrollTop=$('#chat').scrollHeight; $('#messageCount').textContent=String($('#chat').querySelectorAll('.message').length).padStart(2,'0')+' messages'; }
      function stageCard(stage, index){
        const tools = stage.tools || (stage.tool ? [stage.tool] : []);
        const result = stage.results ? stage.results.map(item=>`<div class="result"><b>${safe(item.tool)}</b>: ${safe(item.text)} <a href="${safe(item.source)}" target="_blank" rel="noreferrer" style="color:var(--cyan)">source ↗</a></div>`).join('') : (stage.result ? `<div class="result">${safe(stage.result)}${stage.source ? ` <a href="${safe(stage.source)}" target="_blank" rel="noreferrer" style="color:var(--cyan)">source ↗</a>` : ''}</div>` : '');
        const review = stage.id === 'approval' && stage.status === 'approval_required' ? `<div class="approval">approval required · Gmail will not be contacted until you choose</div><div class="review"><div class="review-label">Human review · outbound email</div><div class="draft"><b>${safe(stage.subject || 'Email draft')}</b><br>${safe(stage.result || '')}</div><div class="review-actions"><button class="approve" data-action="approve" type="button">Approve & send</button><button class="reject" data-action="reject" type="button">Reject & stop</button></div></div>` : '';
        const state = `<b class="status ${statusClass(stage.status)}">${safe(statusLabel(stage.status))}</b>`;
        const errorBox = stage.status === 'error' ? `<div class="error-box">${safe(stage.error || stage.result || 'This stage failed.')}<div class="error-actions"><button class="retry" data-action="retry" type="button">Retry tool</button><button class="replan" data-action="replan" type="button">Replan</button></div></div>` : '';
        return `<article class="step ${stage.status === 'error' ? 'error' : ''} ${stage.status === 'done' ? 'done' : stage.status === 'approval_required' ? 'active' : ''}"><div class="step-card"><div class="step-top"><span class="step-name">${safe(stage.name)}</span><span class="step-num">0${index+1} / 06 ${state}</span></div><p class="step-copy">${safe(stage.copy)}</p><div class="tool-row">${tools.map(tool=>`<span class="tool">${safe(tool)}</span>`).join('')}</div>${result}${errorBox}${review}</div></article>`;
      }
      function renderMission(mission){
        activeMission=mission; $('#goalText').textContent=mission.plan?.goal || mission.prompt; $('#timeline').innerHTML=(mission.stages||[]).map(stageCard).join(''); $('#final').hidden=true; $('#liveText').textContent=mission.answer?'mission complete':(mission.decision==='rejected'?'safe stop':'awaiting approval');
        if(mission.answer){ $('#finalText').textContent=mission.answer; $('#final').hidden=false; }
        $('#timeline').querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>performAction(button.dataset.action)));
      }
      function showError(error, canRetry=true){ $('#timeline').innerHTML=`<article class="step error"><div class="step-card"><div class="step-top"><span class="step-name">Mission blocked</span><span class="status error">error</span></div><p class="step-copy">The backend did not claim completion. No canned evidence or email result was inserted.</p><div class="error-box">${safe(error)}${canRetry?'<div class="error-actions"><button class="retry" id="missionRetry" type="button">Retry mission</button><button class="replan" id="missionReplan" type="button">Replan from prompt</button></div>':''}</div></div></article>`; $('#final').hidden=true; $('#liveText').textContent='blocked · action required'; const retry=$('#missionRetry'); if(retry)retry.onclick=()=>launch('retry'); const replan=$('#missionReplan'); if(replan)replan.onclick=()=>launch('replan'); }
      async function requestJSON(url, body){ const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); const data=await response.json().catch(()=>({error:'Invalid server response'})); if(!response.ok)throw new Error(data.error || 'Backend request failed'); return data; }
      async function launch(mode='new'){ const prompt=promptBox.value.trim() || activeMission?.prompt; if(!prompt || sendBtn.disabled)return; if(mode==='new'){ $('.empty-note')?.remove(); addLiveMessage(prompt,'user'); promptBox.value=''; } sendBtn.disabled=true; $('#liveText').textContent=mode==='new'?'planning with Gemini':'retrying backend mission'; $('#goalText').textContent=prompt; $('#timeline').innerHTML='<div class="step active"><div class="step-card"><div class="step-name">Backend mission in progress</div><p class="step-copy">Gemini is planning; live tools have not been replaced with demo data.</p></div></div>'; try{ const data=await requestJSON('/api/mission',{prompt}); renderMission(data.mission); }catch(error){ showError(error.message); }finally{sendBtn.disabled=false; } }
      async function performAction(action){ if(!activeMission)return; $('#liveText').textContent=action==='approve'?'sending through Gmail':action==='reject'?'canceling email':'running live tool'; try{ const data=await requestJSON(`/api/mission/${activeMission.id}/${action}`,{}); renderMission(data.mission); if(action==='approve' && data.mission.decision!=='approved')showError('Gmail did not confirm a successful send.'); }catch(error){ const stage=activeMission.stages.find(item=>item.id==='approval'); if(stage){stage.status='error';stage.error=error.message;} renderMission(activeMission); $('#liveText').textContent='send blocked · action required'; } }
      function resetRoom(){ activeMission=null; runToken++; $('#chat').innerHTML='<p class="empty-note">Give the agent a mission.<br><span style="color:var(--cyan)">Watch it think in signals.</span></p>'; $('#timeline').innerHTML=''; $('#final').hidden=true; $('#goalText').textContent='No request received yet. The room is listening.'; $('#liveText').textContent='standing by'; $('#messageCount').textContent='00 messages'; promptBox.value=''; sendBtn.disabled=false; }
      async function health(){ try{const response=await fetch('/api/health');const data=await response.json();$('#runtimeText').textContent=data.gemini?'Gemini ready · '+data.model:'Gemini unavailable · missions blocked';}catch(error){$('#runtimeText').textContent='backend unavailable';} }
      sendBtn.addEventListener('click',()=>launch()); promptBox.addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){event.preventDefault();launch();}}); $('#resetBtn').addEventListener('click',resetRoom); document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{promptBox.value=chip.dataset.prompt;promptBox.focus();})); health();
    })();
  </script>
</body>
</html>
